<!doctype html><meta charset=utf-8><title>Mercado Alfa | iFood</title><body><h1>Mercado Alfa</h1>
<p>Entrega R$ 7,99 • Pedido mínimo R$ 30,00</p><div class="c"><div>Arroz Branco Tipo 1 5kg</div><span>R$ 29,90</span><button aria-label="Adicionar" onclick="add('Arroz Branco Tipo 1 5kg',1)">+</button></div><div class="c"><div>Feijão Carioca 1kg</div><span>R$ 8,49</span><button aria-label="Adicionar" onclick="add('Feijão Carioca 1kg',1)">+</button></div><div class="c"><div>Leite Integral 1L</div><span>R$ 5,29</span><button aria-label="Adicionar" onclick="add('Leite Integral 1L',1)">+</button></div><div class="c"><div>Café Torrado 500g</div><span>R$ 19,90</span><button aria-label="Adicionar" onclick="add('Café Torrado 500g',1)">+</button></div>
<button onclick="window.__finalizou=true">Finalizar pedido</button><script>
window.__cart = {}; window.__finalizou = false;
function add(n, q){ window.__cart[n] = (window.__cart[n]||0) + q; }
function abrir(n){
  const d = document.createElement('div'); d.setAttribute('role','dialog'); let q = 1;
  d.innerHTML = '<h2>'+n+'</h2><button aria-label="Diminuir quantidade">-</button><span id="q">1</span><button aria-label="Aumentar quantidade">+</button><button id="ok">Adicionar</button>';
  d.querySelector('[aria-label^=Aumentar]').onclick = (e)=>{ e.stopPropagation(); q++; d.querySelector('#q').textContent = q; };
  d.querySelector('#ok').onclick = (e)=>{ e.stopPropagation(); add(n, q); d.remove(); };
  document.body.appendChild(d);
}
</script></body>
